# Builds and tests every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libicu-dev libgraphite2-dev libfontconfig1-dev \
            libfreetype-dev libpng-dev zlib1g-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tests that typeset (formulas, templates) fetch their LaTeX
      # packages once; keep them between runs.
      - name: LaTeX packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/tectec/tex
          key: tex-cache-${{ hashFiles('Cargo.lock') }}

      - run: cargo build --locked
      - run: cargo test --locked
